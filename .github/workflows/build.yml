name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'

      - name: Build release binary
        run: swift build -c release

      - name: Create .app bundle
        run: |
          APP_NAME="MiniPad"
          BUILD_DIR="build"
          APP_BUNDLE="${BUILD_DIR}/${APP_NAME}.app"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          cp .build/release/MiniPad "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          cat > "${APP_BUNDLE}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIconFile</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>com.minipad.app</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          APP_NAME="MiniPad"
          BUILD_DIR="build"
          mkdir -p "${BUILD_DIR}/dmg_root"
          cp -R "${BUILD_DIR}/${APP_NAME}.app" "${BUILD_DIR}/dmg_root/"
          ln -s /Applications "${BUILD_DIR}/dmg_root/Applications"
          hdiutil create -volname "${APP_NAME} Installer" \
            -srcfolder "${BUILD_DIR}/dmg_root" \
            -ov -format UDZO \
            "${BUILD_DIR}/${APP_NAME}-Installer.dmg"
          rm -rf "${BUILD_DIR}/dmg_root"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniPad-Installer
          path: build/MiniPad-Installer.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MiniPad-Installer.dmg
          generate_release_notes: true
